baseURL = "https://cunninghamshane.com/"
locale = "en-US"
title = "Shane Cunningham"
theme = "mono-pop"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  name = "Shane Cunningham"
  handle = "shane"
  tagline = "Personal blog of an infrastructure engineer."
  defaultTheme = "light"
  googleFonts = true
  showToc = true

  [[params.social]]
    name = "github"
    url = "https://github.com/shanecunningham"
  [[params.social]]
    name = "rss"
    url = "/index.xml"

[[menus.main]]
  name = "posts"
  pageRef = "/posts"
  weight = 10
[[menus.main]]
  name = "archive"
  pageRef = "/archive"
  weight = 20
[[menus.main]]
  name = "tags"
  pageRef = "/tags"
  weight = 30
[[menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 40
